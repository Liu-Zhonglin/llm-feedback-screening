[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-feedback-screening"
version = "0.1.0"
description = "Reproducibility package for incentive screening and preference-learning experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.2",
    "datasets>=3.2",
    "huggingface-hub>=0.27",
    "matplotlib>=3.9",
    "numpy<3",
    "pandas>=2.2",
    "peft>=0.14",
    "pytest>=8",
    "pyyaml>=6",
    "safetensors>=0.4",
    "scikit-learn>=1.5",
    "scipy>=1.12",
    "torch>=2.2",
    "tqdm>=4.66",
    "transformers>=4.47",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
